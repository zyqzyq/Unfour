name: Standard Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Standard Stable tag to publish (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  identity:
    name: Resolve Standard release identity
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      distribution: ${{ steps.resolve.outputs.distribution }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Validate Standard Stable release contract
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-contract.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve checked-out build commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  standard-build:
    name: Verify and build signed Standard artifacts
    needs: identity
    uses: ./.github/workflows/reusable-standard-build.yml
    with:
      checkout_ref: ${{ needs.identity.outputs.commit }}
      version: ${{ needs.identity.outputs.version }}
      build_commit: ${{ needs.identity.outputs.commit }}
      artifact_prefix: release-assets
    secrets: inherit

  publish:
    name: Publish identical Standard artifacts
    needs: [identity, standard-build]
    concurrency:
      group: standard-stable-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Finalize checksums and updater manifest
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          printf 'Unfour %s Standard stable release.' "$VERSION" > release-notes.txt
          node scripts/finalize-standard-release.mjs --assets-dir release-assets --version "$VERSION" --base-url https://releases.unfour.dev --notes-file release-notes.txt
      - name: Upload immutable files to Cloudflare R2 and verify bytes
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir r2-existing
          aws s3 cp "s3://${R2_BUCKET}/stable/${VERSION}/" r2-existing --recursive --endpoint-url "$endpoint"
          while IFS= read -r -d '' existing; do
            relative="${existing#r2-existing/}"
            test -f "release-assets/${relative}"
            cmp --silent "$existing" "release-assets/${relative}" || {
              echo "Refusing to overwrite immutable R2 object stable/${VERSION}/${relative}" >&2
              exit 1
            }
          done < <(find r2-existing -type f -print0)
          aws s3 cp release-assets "s3://${R2_BUCKET}/stable/${VERSION}/" --recursive --exclude latest.json --endpoint-url "$endpoint"
          mkdir r2-verify
          aws s3 cp "s3://${R2_BUCKET}/stable/${VERSION}/" r2-verify --recursive --endpoint-url "$endpoint"
          (cd r2-verify && sha256sum -c ../release-assets/SHA256SUMS.txt)
      - name: Create GitHub Release from the same staged files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.identity.outputs.tag }}
          name: Unfour ${{ needs.identity.outputs.tag }}
          prerelease: false
          body: |
            Unfour `${{ needs.identity.outputs.tag }}` is the Standard stable release.

            GitHub Release and Cloudflare R2 receive the same build artifacts. Verify them with `SHA256SUMS.txt`. The internal updater reads `https://releases.unfour.dev/stable/latest.json`.

            Microsoft Store packages are built, validated, and submitted separately by the manual MSIX process.
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Check update order and publish stable latest manifest
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/check-update-order.mjs \
            --candidate-version "$VERSION" \
            --latest-url https://releases.unfour.dev/stable/latest.json
          aws s3 cp release-assets/latest.json "s3://${R2_BUCKET}/stable/latest.json" --content-type application/json --cache-control no-cache --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
