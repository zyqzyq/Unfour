name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build, test]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.task }}

  release-contracts:
    name: Release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release environment and contract tests
        run: pnpm run test:release-env

      - name: Public secret audit
        run: pnpm run check:secrets

      - name: Migration integrity check
        run: pnpm run check:migrations

      - name: Large-file guard with copied Monaco assets
        run: |
          node scripts/prepare-monaco.mjs
          pnpm run check:large-files

  rust:
    name: Rust ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check, test]
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}

      - name: Prepare Tauri sidecars
        run: node scripts/prepare-tauri-sidecars.mjs

      - name: cargo check (workspace)
        if: matrix.task == 'check'
        run: cargo check --workspace

      - name: cargo check (ssh-native)
        if: matrix.task == 'check'
        run: cargo check -p unfour --features ssh-native

      - name: cargo test (workspace except MCP)
        if: matrix.task == 'test'
        run: cargo test --workspace --exclude unfour-mcp

  mcp-contracts:
    name: MCP contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MCP system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-contracts

      - name: MCP crate tests (including binary protocol contracts)
        run: cargo test -p unfour-mcp
