[package]
name = "unfour"
version.workspace = true
description = "A cross-platform operations and development workspace."
authors = ["Unfour"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unfour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
url = "2"
# Kept as a direct dependency so tauri-build can resolve this plugin's
# permission manifests for `capabilities/` (the runtime `.plugin()` call lives
# in `unfour-app`). Any plugin referenced by a capability must be a direct
# dependency of the binary crate, not only of `unfour-app`.
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Direct dependency (same reason as opener): SFTP upload/download use the
# frontend dialog plugin, so tauri-build must resolve its permission manifest.
tauri-plugin-dialog = "2"
# Direct dependency (same reason as opener): tauri-build must resolve this
# plugin's permission manifest for `capabilities/`. The runtime `.plugin()`
# call lives in `unfour-app`; any plugin referenced by a capability must be a
# direct dependency of this binary crate, not only of `unfour-app`.
tauri-plugin-window-state = "2"
# Standard builds register this plugin and use signed NSIS updater artifacts.
# Microsoft Store builds compile the same command surface but never register
# the plugin and reject every internal updater command at runtime.
tauri-plugin-updater = "2"
# Shared composition layer (plugins, command-bus setup, AppState, commands).
unfour-account = { path = "../../../crates/unfour-account" }
unfour-app = { path = "../../../crates/unfour-app", features = ["deep-link"] }
unfour-cloud-sync = { path = "../../../crates/unfour-cloud-sync" }
unfour-cloud-sync-storage = { path = "../../../crates/unfour-cloud-sync-storage" }
unfour-command-bus = { path = "../../../crates/unfour-command-bus" }
unfour-core = { path = "../../../crates/unfour-core" }
unfour-local-storage = { path = "../../../crates/local-storage" }
unfour-paths = { path = "../../../crates/unfour-paths" }
unfour-secret-store = { path = "../../../crates/secret-store" }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Real SSH transport is enabled for the desktop binary so connected sessions
# write to an actual PTY and stream output back. Without it, SSH runs in the
# simulated fallback (used by the browser/test builds) where typed input is
# never echoed. Disable explicitly with `--no-default-features` for a
# dependency-light build.
default = ["ssh-native"]
ssh-native = ["unfour-app/ssh-native"]

[target.'cfg(windows)'.dependencies]
# Enable Windows system proxy lookup for the updater's reqwest client.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
