[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/unfour-core",
  "crates/local-storage",
  "crates/http-engine",
  "crates/flow-engine",
  "crates/database-engine",
  "crates/redis-engine",
  "crates/ssh-engine",
  "crates/workspace-engine",
  "crates/unfour-paths",
  "crates/unfour-diag",
  "crates/secret-store",
  "crates/unfour-command-bus",
  "crates/unfour-mcp",
  "crates/unfour-app",
  "crates/unfour-account",
  "crates/unfour-telemetry",
  "crates/unfour-cloud-sync",
  "crates/unfour-cloud-sync-storage",
]
resolver = "2"

[workspace.package]
version = "0.14.0"

[patch.crates-io]
# SQLx 0.8.6 needs a pool-scoped socket factory to carry its normal database
# handshake and TLS identity over an already authorized SSH channel.
sqlx-core = { path = "vendor/sqlx-core" }

