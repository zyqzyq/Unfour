[package]
name = "unfour-cloud-sync"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
unfour-command-bus = { path = "../unfour-command-bus" }
unfour-core = { path = "../unfour-core" }
unfour-database-engine = { path = "../database-engine" }
unfour-http-engine = { path = "../http-engine" }
unfour-local-storage = { path = "../local-storage" }
unfour-secret-store = { path = "../secret-store" }
unfour-ssh-engine = { path = "../ssh-engine" }
unfour-workspace-engine = { path = "../workspace-engine" }

[dev-dependencies]
unfour-cloud-sync-storage = { path = "../unfour-cloud-sync-storage" }
